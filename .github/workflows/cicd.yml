name: Banking CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/banking:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # ÖNEMLİ: Dosyaları kopyalamadan önce checkout yapmamız şart
      - uses: actions/checkout@v4

      - name: Copy files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          # Source kısmını yıldız yaparak tüm dosyaları garantiye alıyoruz
          source: "docker-compose.yml,banking-nginx.conf,deploy.sh"
          target: "/home/ubuntu/banking-app"

      - name: Execute remote commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Klasörün varlığından emin olalım
            mkdir -p /home/ubuntu/banking-app
            chmod +x /home/ubuntu/banking-app/deploy.sh
            /home/ubuntu/banking-app/deploy.sh